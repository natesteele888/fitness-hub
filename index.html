<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="/apps/icons/fitness-192.png">
<link rel="apple-touch-icon" href="/apps/icons/fitness-512.png">
<title>Power Program</title>
<meta name="description" content="A 9-week offseason plyometrics, core &amp; dumbbell program — built for mornings.">
<meta name="theme-color" content="#0A0D12">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Power Program">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0D12;
    --surface:#151A22;
    --surface2:#1C2430;
    --line:#2A3340;
    --text:#EEF2F8;
    --muted:#8C98AC;
    --volt:#C6FF3D;
    --volt-ink:#0A0D12;
    --ember:#FF6B3D;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3{font-family:'Oswald',sans-serif;margin:0}
  main{max-width:520px;margin:0 auto;padding:0 14px 48px}
  header.top{padding:26px 4px 10px;text-align:center}
  header.top h1{
    display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
    font-weight:700;font-size:clamp(21px,6.4vw,27px);color:var(--text);line-height:1.1;text-transform:uppercase;letter-spacing:.01em;
  }
  header.top h1 .bolt{color:var(--volt);flex:none}
  header.top h1 .accent{color:var(--volt)}
  header.top .sub{margin:8px 0 0;color:var(--muted);font-size:15px}
  .info-strip{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;margin:14px 0;font-size:13.5px;color:var(--muted);line-height:1.5;
  }
  .info-strip b{color:var(--volt)}
  .progressbar{height:10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;margin:4px 0 10px}
  .progressbar .fill{height:100%;background:var(--volt);border-radius:999px;transition:width .3s}
  .statline{font-size:14px;color:var(--muted);text-align:center;margin-bottom:14px;font-weight:600}
  .statline b{color:var(--text)}
  nav.tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab{
    flex:1;border:2px solid var(--volt);background:var(--surface);color:var(--volt);
    font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;letter-spacing:.02em;
    border-radius:999px;padding:10px 0;cursor:pointer;
  }
  .tab[aria-pressed="true"]{background:var(--volt);color:var(--volt-ink)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px}
  .phase-pill{
    display:inline-block;background:var(--surface2);color:var(--volt);font-family:'Oswald',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.03em;text-transform:uppercase;
    border-radius:999px;padding:5px 12px;margin-bottom:10px;
  }
  .daynum{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:2px}
  .daytitle{font-size:26px;font-weight:700;color:var(--text);line-height:1.1;margin-bottom:4px;text-transform:uppercase}
  .daytime{color:var(--muted);font-size:14.5px;margin-bottom:16px}
  .daynav{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .daynav button{
    border:0;background:none;color:var(--volt);font-family:'Oswald',sans-serif;
    font-weight:600;font-size:15px;cursor:pointer;padding:6px 8px;text-transform:uppercase;
  }
  .daynav button:disabled{color:var(--line);cursor:default}

  .section-head{
    font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--text);
    text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;display:flex;align-items:center;gap:8px;
  }
  .section-head .chip{
    background:var(--surface2);color:var(--volt);border-radius:999px;padding:2px 10px;font-size:12.5px;
    text-transform:none;letter-spacing:0;font-weight:700;font-family:'Inter',sans-serif;
  }
  ul.exlist{list-style:none;margin:0;padding:0}
  ul.exlist li{
    display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);
  }
  ul.exlist li:last-child{border-bottom:0}
  .exbox{
    flex:none;width:26px;height:26px;border-radius:8px;border:2.5px solid var(--volt);
    background:transparent;margin-top:1px;cursor:pointer;display:grid;place-items:center;
  }
  .exbox.checked{background:var(--volt)}
  .exbox.checked::after{content:"✓";color:var(--volt-ink);font-weight:800;font-size:16px}
  .exmeta{flex:1}
  .exname{font-weight:600;color:var(--text);font-size:16px}
  .exname .tag{font-size:11px;color:var(--ember);font-weight:700;margin-left:4px;border:1px solid var(--ember);border-radius:5px;padding:1px 4px;vertical-align:1px}
  .exreps{color:var(--volt);font-weight:700;font-size:14.5px;white-space:nowrap;margin-left:auto;padding-left:10px}
  .excue{color:var(--muted);font-size:14px;margin-top:2px;line-height:1.35}

  .note{
    margin:18px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:14.5px;line-height:1.5;color:var(--text);
  }
  .note b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--volt);margin-bottom:3px;font-family:'Oswald',sans-serif}

  .complete-btn{
    width:100%;min-height:58px;border:0;border-radius:16px;cursor:pointer;margin-top:20px;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.03em;text-transform:uppercase;
    background:var(--volt);color:var(--volt-ink);
  }
  .complete-btn.done{background:var(--surface2);color:var(--volt);border:2px solid var(--volt)}

  .rest-card .daytitle{color:var(--text)}
  .tip{background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:15px;margin-top:4px;color:var(--text)}

  .celebrate{text-align:center;padding:30px 10px}
  .celebrate .big{font-size:52px;margin-bottom:6px}
  .celebrate h2{font-size:25px;color:var(--text);margin-bottom:8px;text-transform:uppercase}
  .celebrate p{color:var(--muted);font-size:15px;max-width:34ch;margin:0 auto}

  .weekblock{margin-bottom:22px}
  .weekblock .wh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .weekblock .wh h3{font-size:19px;color:var(--text)}
  .weekblock .wh span{font-size:12.5px;color:var(--volt);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-family:'Oswald',sans-serif}
  .chipgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
  .daychip{
    min-width:0;overflow:hidden;
    aspect-ratio:1;border-radius:10px;border:2px solid var(--line);background:var(--surface2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
    font-family:'Oswald',sans-serif;
  }
  .daychip .n{font-weight:700;font-size:15px;color:var(--text)}
  .daychip .t{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
  .daychip.done{background:var(--volt);border-color:var(--volt)}
  .daychip.done .n,.daychip.done .t{color:var(--volt-ink)}
  .daychip.selected{border-color:var(--ember);box-shadow:0 0 0 2px var(--ember)}
  .daychip.rest{background:var(--surface)}

  .phase-divider{
    margin:26px 0 14px;padding-top:14px;border-top:2px solid var(--line);
  }
  .phase-divider h2{font-size:20px;color:var(--text);text-transform:uppercase}
  .phase-divider p{font-size:14px;color:var(--muted);margin-top:4px}

  .backup-box{width:100%;min-height:80px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);color:var(--text);font-size:12px;font-family:monospace;padding:10px;resize:vertical;box-sizing:border-box}
  .backup-box[hidden]{display:none}
  .backup-note{font-size:12.5px;color:var(--muted);margin-top:8px}
  .backup-note[hidden]{display:none}
  .resetwrap{text-align:center;margin-top:26px}
  .resetwrap button{
    border:0;background:none;color:var(--muted);text-decoration:underline;font-size:13.5px;cursor:pointer;font-family:inherit;
  }

  .phtitle{font-family:'Oswald',sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;color:var(--text);margin-bottom:4px}
  .phsub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .mrow{margin-bottom:16px}
  .mrow label{display:block;font-weight:600;font-size:14.5px;color:var(--text);margin-bottom:4px}
  .mrow .inputwrap{display:flex;align-items:center;gap:8px}
  .mrow input{
    flex:1;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);
    color:var(--text);font-size:16px;padding:0 12px;font-family:inherit;
  }
  .mrow input::placeholder{color:var(--muted)}
  .mrow input:focus{outline:none;border-color:var(--volt)}
  .mrow .unit{color:var(--muted);font-size:13.5px;min-width:26px}
  .mrow .hint{font-size:12.5px;color:var(--muted);margin-top:4px}
  .metric-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .metric-card .mlabel{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:700;font-family:'Oswald',sans-serif}
  .metric-card .mvalue{font-family:'Oswald',sans-serif;font-size:27px;font-weight:700;color:var(--text);margin:2px 0 2px}
  .metric-card .mdelta{font-size:13px;font-weight:600}
  .metric-card .mdelta.good{color:var(--volt)}
  .metric-card .mdelta.bad{color:var(--ember)}
  .metric-card .mdelta.neutral{color:var(--muted)}
  .metric-card .empty{font-size:13.5px;color:var(--muted);margin-top:2px}
  .metric-card .spark{display:block;margin-top:8px}
  .history{margin-top:4px}
  .history summary{cursor:pointer;color:var(--volt);font-weight:700;font-size:14px;padding:10px 2px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em}
  .hrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .hrow .hdate{color:var(--text);font-weight:700;min-width:46px;font-family:'Oswald',sans-serif}
  .hrow .hvals{color:var(--muted);flex:1}
  .hrow .hdel{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;padding:2px 6px;line-height:1}
  .hrow .hdel:hover{color:var(--ember)}
    .asym{border-left:3px solid var(--volt)}
    .asym.warn{border-left-color:var(--ember)}
    .asymnum{font-family:Oswald,sans-serif;font-size:34px;line-height:1.1;color:var(--volt);margin:2px 0 4px}
    .asym.warn .asymnum{color:var(--ember)}
    .asymnum span{font-family:Inter,sans-serif;font-size:13px;font-weight:500;color:var(--muted);margin-left:8px}

  .ex-info{
    display:inline-flex;align-items:center;justify-content:center;
    width:18px;height:18px;border-radius:50%;border:1.5px solid var(--volt);color:var(--volt);
    background:none;font-family:Georgia,serif;font-style:italic;font-size:12px;font-weight:700;
    cursor:pointer;vertical-align:2px;margin-left:5px;padding:0;line-height:1;flex:none;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;
    z-index:50;
  }
  .modal-overlay[hidden]{display:none}
  .modal-card{
    background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
    padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-width:520px;width:100%;
    max-height:85vh;overflow-y:auto;position:relative;
  }
  .modal-close{
    /* above the video poster, which sits later in the DOM and otherwise
       paints over it and swallows the tap that closes the card */
    z-index:3;
    position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;
    border:1.5px solid var(--line);background:var(--surface2);color:var(--muted);font-size:18px;cursor:pointer;
  }
  .modal-icon{width:84px;height:84px;margin:0 auto 10px}
  .modal-icon svg{width:100%;height:100%;display:block}
  .modal-icon.has-photo{width:100%;height:170px;border-radius:14px;overflow:hidden;background:var(--surface2)}
  /* contain, not cover: a tall photo cropped to a 170px strip showed a torso
     and nothing of the movement. */
  .modal-icon.has-photo img{width:100%;height:100%;object-fit:contain;display:block}
  /* Video poster. padding-top rather than aspect-ratio so old iOS keeps 16:9. */
  .modal-icon.has-video{width:100%;height:0;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000;position:relative}
  .modal-icon.has-video > *{position:absolute;top:0;left:0;width:100%;height:100%}
  .modal-icon.has-video img{object-fit:cover;display:block}
  .modal-icon.has-video iframe{border:0;display:block}
  .modal-icon .playbtn{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.30);border:0;padding:0;cursor:pointer;transition:background .15s}
  .modal-icon .playbtn:hover,.modal-icon .playbtn:focus-visible{background:rgba(0,0,0,.12)}
  .modal-icon .playbtn svg{width:64px;height:64px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.65))}
  .vid-note{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;box-sizing:border-box;background:#1c1f26;color:#fff;text-align:center;font-size:15px;line-height:1.35}
  .vid-note small{opacity:.75;font-size:13px}
  .video-frame .vid-note{position:absolute;inset:0}
  .modal-focus{
    text-align:center;color:var(--volt);font-family:'Oswald',sans-serif;font-weight:700;font-size:12.5px;
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;
  }
  .modal-name{text-align:center;font-size:24px;margin-bottom:14px;text-transform:uppercase}
  .modal-how{font-size:15.5px;line-height:1.5;margin-bottom:14px}
  .modal-safety{
    background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;
    color:var(--text);margin-bottom:16px;
  }
  .modal-safety b{display:block;color:var(--ember);font-family:'Oswald',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
  .modal-video-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:52px;
    border-radius:14px;border:2px solid var(--volt);color:var(--volt);text-decoration:none;background:none;
    font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em;
    cursor:pointer;
  }
  .modal-video-btn[hidden]{display:none}

  .video-lightbox{
    background:#000;border-radius:16px;max-width:720px;width:100%;position:relative;overflow:hidden;
  }
  .video-frame{position:relative;width:100%;padding-top:56.25%}
  .video-frame iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;display:block}
  .video-lightbox .modal-close{background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.3);color:#fff;z-index:2}

  .pump{background:linear-gradient(135deg,rgba(198,255,61,.14),rgba(255,107,61,.10));border:1px solid rgba(198,255,61,.35);border-radius:14px;padding:13px 15px;margin-bottom:14px;font-family:Oswald,sans-serif;font-size:17px;line-height:1.35;color:var(--text);letter-spacing:.01em}
  .remind{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:var(--text);font-size:15px;margin-top:14px}
  .remindhead{display:flex;align-items:center;gap:10px}
  .remindhead b{font-family:Oswald,sans-serif;font-size:16px;display:block}
  .remindhead .sub{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .remindhead .bolt{font-size:20px;flex:0 0 auto}
  .remindctl{display:flex;align-items:center;gap:9px;margin-top:13px}
  .remindctl label{font-size:12.5px;color:var(--muted);flex:0 0 auto}
  .remindctl select{flex:1 1 auto;min-width:0;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit}
  .remindgo{display:block;margin-top:11px;text-align:center;background:var(--volt);color:#0A0D12;font-family:Oswald,sans-serif;font-size:15px;letter-spacing:.02em;text-decoration:none;border-radius:10px;padding:11px}
  .remindnote{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}
</style>
</head>
<body>
<main id="app">
  <header class="top">
    <h1><svg class="bolt" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg><span class="accent">Power</span> Program</h1>
    <p class="sub">9 weeks of plyometrics, core &amp; light dumbbells — built for mornings.</p>
  </header>

  <div class="progressbar"><div class="fill" id="progFill" style="width:0%"></div></div>
  <div class="statline" id="statLine"></div>

  <nav class="tabs">
    <button class="tab" data-tab="today" aria-pressed="true">Today</button>
    <button class="tab" data-tab="program" aria-pressed="false">Program</button>
    <button class="tab" data-tab="progress" aria-pressed="false">Progress</button>
  </nav>

  <div id="view-today"></div>
  <div id="view-program" hidden></div>
  <div id="view-progress" hidden></div>
</main>
<div class="modal-overlay" id="exOverlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exName">
    <button class="modal-close" id="exClose" aria-label="Close">&times;</button>
    <div class="modal-icon" id="exIconWrap"></div>
    <div class="modal-focus" id="exFocus"></div>
    <h3 class="modal-name" id="exName"></h3>
    <div class="modal-how" id="exHow"></div>
    <div class="modal-safety"><b>Watch For</b><span id="exSafety"></span></div>
    <button class="modal-video-btn" id="exVideo" type="button" hidden>Watch Video</button>
  </div>
</div>
<div class="modal-overlay" id="videoOverlay" hidden>
  <div class="video-lightbox" role="dialog" aria-modal="true" aria-label="Exercise video">
    <button class="modal-close" id="videoClose" aria-label="Close video">&times;</button>
    <div class="video-frame" id="videoFrame"></div>
  </div>
</div>


<script>
(function(){
  "use strict";

  // ---------- Content ----------

  var PHASES = [
    { name:"Foundation", blurb:"Learn to land soft, brace your core, and get comfortable with the dumbbells before anything gets fast or heavy." },
    { name:"Build", blurb:"More rounds, more explosive, dumbbells step up to 8 lb. This is where the engine gets built." },
    { name:"Power", blurb:"Full speed, full power. This is what shows up on the mound, at the plate, and on the field next fall." }
  ];

  var DAY_ORDER = ["B","A","C","D","E","F","REST"];
  var TYPE_LABEL = { B:"Plyo & Power", A:"Core", C:"Dumbbells", D:"Speed & Agility", E:"Rotational Core", F:"Full-Body", REST:"Rest" };
  var CHIP_LABEL = { B:"Plyo", A:"Core", C:"DB", D:"Speed", E:"Rotate", F:"Full", REST:"Rest" };

  function w(name, reps, cue, eq){
    var o = { name:name, reps:reps };
    if(cue) o.cue = cue;
    if(eq) o.eq = eq;
    return o;
  }

  var EXLIB = {
    "march-jog": { name:"Jog or March in Place", focus:"Warm-Up", icon:"speed", how:"Jog lightly in place or march with high-ish knees, swinging your arms naturally. This is just to get your heart rate up and blood flowing before anything harder.", safety:"Easy effort only \u2014 you should be able to talk normally the whole time.", video:"Jog or March in Place" },
    "bw-squat": { name:"Bodyweight Squat", focus:"Lower Body Power", icon:"squat", how:"Stand with feet shoulder-width apart. Push your hips back and bend your knees like you're sitting into a chair, keeping your chest up and heels on the floor. Stand back up by pushing the floor away.", safety:"Knees track over your toes, not caving in. Go as low as you can with good form.", video:"Bodyweight Squat" },
    "pogo-hop": { name:"Pogo Hop", focus:"Lower Body Power", icon:"jump-vertical", photo:"assets/exercise-photos/pogo-hop.webp", photoFallback:"assets/exercise-photos/pogo-hop-still.jpg", how:"Stand tall and hop in place using mostly your ankles, not your knees \u2014 think of a pogo stick. Keep hops small, quick, and light, barely leaving the ground each time.", safety:"Stay on the balls of your feet. If it's a single-leg version, hold a wall for balance at first.", video:"Pogo Hop" },
    "squat-jump": { name:"Squat Jump", focus:"Lower Body Power", icon:"jump-vertical", how:"Drop into a quick squat, then explode straight up as high as you can, swinging your arms up for extra lift. Land soft with bent knees, like you're catching yourself.", safety:"Land quietly \u2014 if you hear a loud slap or thud, you're landing stiff. Bend your knees on landing every time.", video:"Squat Jump" },
    "line-hop": { name:"Line Hop", focus:"Lower Body Power", icon:"jump-horizontal", how:"Put a shoe or piece of tape on the floor as your \"line.\" Hop side to side over it with both feet together, staying light and quick.", safety:"Small, fast hops \u2014 this is about quickness, not height.", video:"Line Hop" },
    "broad-jump": { name:"Broad Jump", focus:"Lower Body Power", icon:"jump-horizontal", how:"Stand with feet hip-width apart, swing your arms back, bend your knees, then jump forward as far as you can, swinging your arms forward as you go. Land on both feet and stick it.", safety:"Land with bent knees and hold the landing for a second before you reset. Give yourself room to land safely.", video:"Broad Jump" },
    "single-leg-broad-jump": { name:"Single-Leg Broad Jump", focus:"Lower Body Power", icon:"jump-horizontal", how:"Same idea as a broad jump, but you take off and land on one leg. Swing your arms, drive off one foot, and land on that same foot, sticking the landing before you reset.", safety:"This one's harder to balance \u2014 start with small jumps and only go for distance once you can stick the landing clean.", video:"Single-Leg Broad Jump" },
    "cat-cow": { name:"Cat-Cow", focus:"Mobility & Warm-Up", icon:"mobility", how:"On hands and knees, alternate between arching your back up toward the ceiling (like a scared cat) and letting your belly drop while you look up (like a cow). Move slowly with your breathing.", safety:"Keep the movement slow and controlled through your whole spine.", video:"Cat-Cow" },
    "hip-circle": { name:"Hip Circle", focus:"Mobility & Warm-Up", icon:"mobility", how:"Stand on one leg (hold something for balance if needed) and draw big slow circles with your other knee, like you're stirring a pot. Do a set of circles one way, then the other.", safety:"Keep the circles under control \u2014 this is about loosening up, not speed.", video:"Hip Circle" },
    "glute-bridge": { name:"Glute Bridge", focus:"Core & Stability", icon:"glute-bridge", how:"Lie on your back with knees bent and feet flat on the floor. Squeeze your glutes and push your hips up toward the ceiling until your body is in a straight line from shoulders to knees, then lower back down.", safety:"Squeeze your glutes, not your lower back, to lift. Don't let your ribs flare up.", video:"Glute Bridge" },
    "plank": { name:"Plank", focus:"Core & Stability", icon:"plank-front", how:"Prop yourself up on your forearms and toes, with your body in one straight line from head to heels \u2014 like a push-up position but resting on your forearms. Hold it there.", safety:"Don't let your hips sag down or stick up high. Squeeze your core and glutes the whole time.", video:"Plank" },
    "dead-bug": { name:"Dead Bug", focus:"Core & Stability", icon:"dead-bug", how:"Lie on your back with arms reaching straight up and knees bent at 90 degrees above your hips. Slowly lower one arm overhead and the opposite leg straight out, just above the floor, then bring them back and switch sides.", safety:"Keep your lower back pressed flat into the floor the whole time \u2014 that's the whole point of the exercise.", video:"Dead Bug" },
    "bird-dog": { name:"Bird Dog", focus:"Core & Stability", icon:"bird-dog", how:"Start on hands and knees. Reach one arm straight out in front while extending the opposite leg straight out behind you, keeping your hips and shoulders level. Hold, then switch sides.", safety:"Move slowly and don't let your hips twist or rock side to side.", video:"Bird Dog" },
    "side-plank": { name:"Side Plank", focus:"Core & Stability", icon:"plank-side", how:"Lie on your side propped up on one forearm, elbow under your shoulder, and lift your hips so your body forms a straight line from head to feet. Hold it, with your top arm reaching straight up.", safety:"If it's too hard at first, keep your knees bent and stacked on the floor for support.", video:"Side Plank" },
    "copenhagen": { name:"Copenhagen Plank", focus:"Injury Prevention", icon:"copenhagen", how:"Lie on your side with your top leg resting on a bench, couch, or chair seat, and your bottom leg hanging free underneath. Prop up on your forearm and lift your hips so your body is in a straight line, squeezing your inner thigh against the bench.", safety:"This one's unusual \u2014 start with your knee on the bench (easier) before trying it with a straight leg. It directly protects the groin muscles kickers rely on.", video:"Copenhagen Plank" },
    "child-pose": { name:"Child's Pose", focus:"Cooldown & Recovery", icon:"stretch", how:"Kneel and sit back on your heels, then fold forward and reach your arms out on the floor in front of you, letting your forehead rest down. Breathe slowly.", safety:"This is a relaxed stretch \u2014 let your body sink into it, don't force anything.", video:"Child's Pose" },
    "seated-fold": { name:"Seated Forward Fold", focus:"Cooldown & Recovery", icon:"stretch", how:"Sit with your legs out straight in front of you and reach forward toward your toes, letting your back round naturally.", safety:"Don't bounce \u2014 just ease into the stretch and hold it still.", video:"Seated Forward Fold" },
    "arm-circle": { name:"Arm Circle", focus:"Mobility & Warm-Up", icon:"mobility", how:"Stick your arms straight out to your sides and make circles, starting small and getting bigger. Do a set one direction, then reverse.", safety:"Keep your arms at shoulder height and your core braced.", video:"Arm Circle" },
    "good-morning": { name:"Bodyweight Good Morning", focus:"Dumbbell Strength", icon:"hinge", how:"Stand with hands behind your head or crossed on your chest. Keeping your back flat and knees soft, hinge forward at your hips until your torso is close to parallel with the floor, then stand back up.", safety:"This is a hip hinge, not a back round \u2014 push your hips back like you're closing a car door with them.", video:"Bodyweight Good Morning" },
    "db-goblet-squat": { name:"DB Goblet Squat", focus:"Dumbbell Strength", icon:"squat", how:"Hold one dumbbell vertically against your chest with both hands, elbows pointing down. Squat down like a bodyweight squat, keeping the weight close to your chest, then stand back up.", safety:"Keep your chest tall and elbows tucked between your knees at the bottom.", video:"goblet squat" },
    "db-suitcase-carry": { name:"DB Suitcase Carry", focus:"Dumbbell Strength", icon:"carry", how:"Hold one dumbbell down at your side like a suitcase and walk a set number of steps, standing as tall as you can the whole way. Switch hands and repeat.", safety:"Don't lean toward the weight \u2014 your shoulders and hips should stay level the whole walk.", video:"DB Suitcase Carry" },
    "db-floor-press": { name:"DB Floor Press", focus:"Dumbbell Strength", icon:"press-floor", how:"Lie on your back with knees bent, holding a dumbbell in each hand at your chest, elbows resting on the floor. Press the weights straight up until your arms are extended, then lower back down with control.", safety:"Your upper arms touching the floor at the bottom is your natural stopping point \u2014 no need to force it further.", video:"DB Floor Press" },
    "db-rdl": { name:"DB Romanian Deadlift", focus:"Dumbbell Strength", icon:"hinge", how:"Hold a dumbbell in each hand in front of your thighs. With soft knees and a flat back, push your hips back and lower the weights down your legs until you feel a stretch in your hamstrings, then drive your hips forward to stand back up.", safety:"This is a hip hinge, not a squat \u2014 your knees barely bend. Keep the weights close to your legs.", video:"Romanian deadlift" },
    "plank-shoulder-tap": { name:"Plank Shoulder Tap", focus:"Core & Stability", icon:"plank-front", how:"From a plank position (on your hands this time, arms straight), tap one shoulder with the opposite hand, then the other shoulder with the other hand, alternating.", safety:"Keep your hips as still as possible \u2014 don't let them rock side to side with each tap.", video:"Plank Shoulder Tap" },
    "nordic": { name:"Nordic Hamstring Lower", focus:"Injury Prevention", icon:"nordic", how:"Kneel on something soft with your feet anchored (a partner holding your ankles, or tucked under something sturdy). Keeping your hips straight and body in one line, slowly lean forward as far as you can control, then catch yourself with your hands on the floor.", safety:"Go only as far as you can control \u2014 the slow lowering is the whole point. This one builds real protection for your hamstrings.", video:"nordic hamstring curl" },
    "quad-stretch": { name:"Quad Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Standing (hold something for balance if needed), grab one foot behind you and gently pull your heel toward your glutes, keeping your knees close together.", safety:"Keep your standing knee soft, not locked out.", video:"Quad Stretch" },
    "calf-stretch": { name:"Calf Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Stand facing a wall, step one foot back, and press that back heel into the floor while leaning into the wall. You should feel it in your lower calf.", safety:"Keep the back leg straight and the heel down the whole time.", video:"Calf Stretch" },
    "hamstring-stretch": { name:"Hamstring Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Sit or stand and extend one leg out, hinging forward from your hips (not rounding your back) until you feel a stretch down the back of your leg.", safety:"Ease into it slowly \u2014 don't bounce.", video:"Hamstring Stretch" },
    "hip-flexor-stretch": { name:"Hip Flexor Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Kneel on one knee with your other foot planted in front, and gently push your hips forward until you feel a stretch in the front of your back hip.", safety:"Keep your torso upright rather than leaning forward.", video:"Hip Flexor Stretch" },
    "chest-stretch": { name:"Doorway Chest Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Stand in a doorway, place your forearm on the frame at about shoulder height, and gently lean forward through the doorway until you feel a stretch across your chest.", safety:"A gentle stretch is enough \u2014 don't force it.", video:"Doorway Chest Stretch" },
    "cobra-stretch": { name:"Cobra Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Lie on your stomach and press your hands into the floor to lift your chest up, keeping your hips on the ground.", safety:"Keep your shoulders relaxed, away from your ears.", video:"Cobra Stretch" },
    "spinal-twist": { name:"Seated Spinal Twist", focus:"Cooldown & Recovery", icon:"stretch", how:"Sit with your legs out in front of you (or one bent over the other), and gently rotate your torso to look behind you, using your arm for a little extra pull.", safety:"Twist from your ribs and lower back, not by yanking with your arm.", video:"Seated Spinal Twist" },
    "shoulder-stretch": { name:"Shoulder Stretch", focus:"Cooldown & Recovery", icon:"stretch", how:"Bring one arm straight across your chest and use your other arm to gently pull it closer in.", safety:"You should feel a light stretch in your shoulder, not pain.", video:"Shoulder Stretch" },
    "full-stretch": { name:"Cool-Down Stretch Flow", focus:"Cooldown & Recovery", icon:"stretch", how:"Move through a few easy stretches for whatever you worked that day \u2014 quads, calves, hamstrings, hips, and chest are the usual suspects. Hold each one for about 20 seconds and breathe.", safety:"Nothing should ever hurt in a stretch \u2014 ease off if it does.", video:"post workout stretching routine" },
    "dynamic-warmup": { name:"Dynamic Warm-Up", focus:"Mobility & Warm-Up", icon:"mobility", how:"A couple minutes of easy movement to wake your body up before training \u2014 jumping jacks, bodyweight squats, and lunges are a good mix.", safety:"Keep it light and controlled; you're waking your body up, not training yet.", video:"dynamic warm up routine" },
    "easy-walk": { name:"Easy Walk or Shoot Around", focus:"Cooldown & Recovery", icon:"stretch", how:"Just move \u2014 a walk, shooting some hoops, anything low-key. The point is light blood flow on a rest day, not a workout.", safety:"Keep the effort easy \u2014 save anything hard for your next training day.", video:"active recovery day" },
    "high-knees": { name:"High Knees", focus:"Speed & Agility", icon:"speed", how:"Jog in place or move forward, driving your knees up toward your waist as fast as you can, pumping your arms with you.", safety:"Stay on the balls of your feet and keep your chest up.", video:"High Knees" },
    "butt-kicks": { name:"Butt Kicks", focus:"Speed & Agility", icon:"speed", how:"Jog in place or move forward, kicking your heels back to try to touch your glutes with each step.", safety:"Keep your knees pointing down, not kicking out to the sides.", video:"Butt Kicks" },
    "lateral-shuffle": { name:"Lateral Shuffle", focus:"Speed & Agility", icon:"shuttle-lateral", how:"Get in a low athletic stance and shuffle sideways without crossing your feet, staying low and quick.", safety:"Keep your feet from touching together, and don't bounce up tall between steps.", video:"Lateral Shuffle" },
    "quick-feet": { name:"Quick Feet", focus:"Speed & Agility", icon:"speed", how:"Run in place with very fast, very small steps, staying light on your toes like the ground is hot.", safety:"Quick and light, not big stomping steps.", video:"Quick Feet" },
    "lateral-hop": { name:"Lateral Hop Over a Line", focus:"Speed & Agility", icon:"shuttle-lateral", how:"Same idea as a line hop, but with more purpose on speed \u2014 hop side to side over a line or shoe as fast as you can with both feet together.", safety:"Stay light and quick, minimal time on the ground.", video:"Lateral Hop Over a Line" },
    "a-skip": { name:"A-Skip", focus:"Speed & Agility", icon:"speed", photo:"assets/exercise-photos/a-skip.webp", how:"A skipping motion where you drive one knee up high while popping off your other foot, pumping your arms opposite to your legs, moving forward.", safety:"Focus on driving the knee up and forward, not just hopping in place.", video:"A-Skip" },
    "sprint-start": { name:"Sprint Start", focus:"Speed & Agility", icon:"speed", how:"From a standing or staggered stance, explode forward and sprint the given distance at full effort, then walk back to recover before the next one.", safety:"Full effort on the sprint, full recovery walking back \u2014 don't rush into the next one gassed.", video:"acceleration sprint drill" },
    "plant-stick": { name:"Plant and Stick", focus:"Injury Prevention", icon:"plant-stick", how:"Take a few steps, then plant your front foot firmly out ahead of you and freeze there, balanced and braced, without kicking through. This trains the braking and stability your plant leg needs.", safety:"Freeze and hold \u2014 this drill is about control, not about following through with a kick.", video:"plant leg stability drill" },
    "torso-twist": { name:"Torso Twist", focus:"Mobility & Warm-Up", icon:"mobility", how:"Stand with arms out and gently rotate your torso side to side, letting your arms swing naturally with the motion.", safety:"Keep it loose and controlled, not a forceful whip.", video:"Torso Twist" },
    "arm-swing": { name:"Arm Swing", focus:"Mobility & Warm-Up", icon:"mobility", how:"Swing both arms forward and backward like big relaxed pendulums, then side to side across your chest.", safety:"Let your arms swing loose \u2014 don't force the range.", video:"Arm Swing" },
    "trunk-rotation": { name:"Standing Trunk Rotation", focus:"Rotational Power", icon:"rotate", how:"Stand with arms held out in front of you and rotate your whole upper body \u2014 hips, ribs, and shoulders together \u2014 from side to side in a controlled motion.", safety:"Rotate your hips and ribs together, not just your arms swinging across your body.", video:"Standing Trunk Rotation" },
    "bear-crawl": { name:"Bear Crawl Hold", focus:"Core & Stability", icon:"bear-crawl", how:"Get on hands and feet with your knees bent and hovering just above the floor, back flat like a tabletop. Hold that position.", safety:"Don't let your hips sag down or pike up high \u2014 keep that flat tabletop shape.", video:"Bear Crawl Hold" },
    "jumping-jack": { name:"Jumping Jack", focus:"Warm-Up", icon:"jumping-jack", how:"Jump your feet out wide while raising your arms overhead, then jump back to standing with arms at your sides. Repeat at a steady rhythm.", safety:"Land soft on the balls of your feet each time.", video:"Jumping Jack" },
    "mountain-climber": { name:"Mountain Climber", focus:"Core & Stability", icon:"plank-front", how:"From a plank position on your hands, drive one knee toward your chest and quickly switch legs, like you're running in place while holding a plank.", safety:"Keep your hips low and steady \u2014 don't let them pop up into the air.", video:"Mountain Climber" },
    "walking-lunge": { name:"Walking Lunge", focus:"Dumbbell Strength", icon:"lunge", how:"Step forward into a lunge, lowering your back knee toward the floor, then push off your front foot to bring your back leg through into the next lunge, walking forward one step at a time.", safety:"Keep your front knee over your ankle, not drifting past your toes.", video:"Walking Lunge" },

  function exInfoFor(name){
    var key = EX_ALIASES[name];
    return key ? EXLIB[key] : null;
  }

  function openExerciseModal(name){
    var info = exInfoFor(name);
    if(!info) return;
    var iconWrap = document.getElementById("exIconWrap");
    if(info.videoId){
      showVideoPoster(iconWrap, info);
    } else if(info.photo){
      iconWrap.classList.remove("has-video");
      iconWrap.classList.add("has-photo");
      iconWrap.innerHTML = "";
      var img = document.createElement("img");
      if(info.photoFallback){
        img.onerror = function(){ this.onerror = null; this.src = info.photoFallback; };
      }
      img.src = info.photo;
      img.alt = info.name;
      iconWrap.appendChild(img);
    } else {
      // both classes must go: the modal is reused, so a leftover has-video
      // would stretch the drawn icon across a black 16:9 box.
      iconWrap.classList.remove("has-photo");
      iconWrap.classList.remove("has-video");
      iconWrap.innerHTML = POSE_ICONS[info.icon] || "";
    }
    document.getElementById("exFocus").textContent = info.focus;
    document.getElementById("exName").textContent = info.name;
    document.getElementById("exHow").textContent = info.how;
    document.getElementById("exSafety").textContent = info.safety;
    // With the poster in the modal the separate button is redundant; it only
    // appears for an exercise that somehow has a video but no poster slot.
    var videoBtn = document.getElementById("exVideo");
    videoBtn.hidden = true;
    videoBtn.onclick = null;
    document.getElementById("exOverlay").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeExerciseModal(){
    document.getElementById("exOverlay").hidden = true;
    // Drop the iframe, or the video keeps playing (and talking) after closing.
    document.getElementById("exIconWrap").innerHTML = "";
    document.body.style.overflow = "";
  }

  // A thumbnail with a play button. Tapping it swaps in the player in the same
  // spot, so the demo runs inside the card instead of opening anything.
  function showVideoPoster(wrap, info){
    wrap.classList.remove("has-photo");
    wrap.classList.add("has-video");
    wrap.innerHTML = "";
    var poster = document.createElement("img");
    poster.alt = "";
    // NOT loading="lazy": the poster is built while the modal is still hidden,
    // and a lazy image in a display:none container never gets fetched at all.
    var hq = "https://i.ytimg.com/vi/" + info.videoId + "/hqdefault.jpg";
    // maxres does not exist for every video, and YouTube does NOT 404 when it
    // is missing -- it serves a 120x90 grey placeholder, so onerror never
    // fires and the poster ends up a blurry smear. Judge it by size on load.
    poster.onload = function(){
      if(this.naturalWidth <= 120 && this.src.indexOf("maxresdefault") !== -1){
        this.onload = null;
        this.src = hq;
      }
    };
    // If even hqdefault can't load (no signal), show a plain dark card with
    // the name instead of a broken-image icon.
    poster.onerror = function(){
      if(this.src !== hq){ this.src = hq; return; }
      this.onerror = null;
      var plain = document.createElement("div");
      plain.className = "vid-note";
      plain.textContent = info.name;
      if(this.parentNode) this.parentNode.replaceChild(plain, this);
    };
    poster.src = "https://i.ytimg.com/vi/" + info.videoId + "/maxresdefault.jpg";
    wrap.appendChild(poster);
    var play = document.createElement("button");
    play.type = "button";
    play.className = "playbtn";
    play.setAttribute("aria-label", "Play the " + info.name + " demo");
    play.innerHTML = PLAY_SVG;
    play.onclick = function(){ playInline(wrap, info.videoId, info.name); };
    wrap.appendChild(play);
  }

  // The demos stream from YouTube, so with no signal the player would load
  // a broken frame. Say so plainly; the written steps stay on screen.
  function videoOfflineNote(){
    var note = document.createElement("div");
    note.className = "vid-note";
    note.setAttribute("role", "status");
    note.innerHTML = "Video needs signal.<small>The steps below still work. Try the video again when you're back online.</small>";
    return note;
  }

  function playInline(wrap, videoId, title){
    if(navigator.onLine === false){
      wrap.innerHTML = "";
      wrap.appendChild(videoOfflineNote());
      return;
    }
    var iframe = document.createElement("iframe");
    // No autoplay=1. Browsers block autoplaying an unmuted cross-origin video
    // even straight after a tap, and a blocked autoplay leaves the player a
    // black rectangle -- the same "shows you nothing" failure this replaced.
    // Without it the player draws its own thumbnail and play button, so the
    // demo is one more tap but always visible. playsinline keeps iOS from
    // yanking it fullscreen.
    iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId)
      + "?rel=0&playsinline=1&modestbranding=1";
    iframe.title = title + " demo video";
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    wrap.innerHTML = "";
    wrap.appendChild(iframe);
  }

  function openVideoLightbox(videoId, title){
    var frame = document.getElementById("videoFrame");
    if(navigator.onLine === false){
      frame.innerHTML = "";
      frame.appendChild(videoOfflineNote());
      document.getElementById("videoOverlay").hidden = false;
      return;
    }
    var iframe = document.createElement("iframe");
    iframe.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(videoId) + "?autoplay=1&rel=0";
    iframe.title = title;
    iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
    iframe.allowFullscreen = true;
    iframe.loading = "lazy";
    frame.innerHTML = "";
    frame.appendChild(iframe);
    document.getElementById("videoOverlay").hidden = false;
  }

  function closeVideoLightbox(){
    document.getElementById("videoOverlay").hidden = true;
    document.getElementById("videoFrame").innerHTML = "";
  }

  // ---------- Measurements ----------

  function fmtFeetIn(v){
    if(v === null || v === undefined || isNaN(v)) return "—";
    var ft = Math.floor(v/12);
    var inch = Math.round((v - ft*12)*10)/10;
    return ft + "'" + inch + '"';
  }
  function fmtLb(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v+" lb"; }
  function fmtSec(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v+" sec"; }
  function fmtYd(v){ return (v===null||v===undefined||isNaN(v)) ? "—" : v+" yd"; }

  var METRICS = [
    { key:"height", label:"Height", unit:"in", step:"0.5", ph:"e.g. 56", hint:"Barefoot against a wall, mark and measure.", fmt:fmtFeetIn, trend:null },
    { key:"weight", label:"Weight", unit:"lb", step:"0.5", ph:"e.g. 78", hint:"Same time of day if you can.", fmt:fmtLb, trend:null },
    { key:"broadJump", label:"Standing Broad Jump", unit:"in", step:"0.5", ph:"e.g. 54", hint:"Feet together, swing your arms, jump forward — measure heel to the start line.", fmt:fmtFeetIn, trend:"up" },
    { key:"plank", label:"Plank Hold", unit:"sec", step:"1", ph:"e.g. 35", hint:"Max time in good plank form — stop when your hips sag.", fmt:fmtSec, trend:"up" },
    { key:"sgBroadL", label:"Single-Leg Broad Jump — Left", unit:"in", step:"0.5", ph:"e.g. 38", hint:"Jump off the left leg and land on the left leg. Stick it or it does not count.", fmt:fmtFeetIn, trend:"up" },
    { key:"sgBroadR", label:"Single-Leg Broad Jump — Right", unit:"in", step:"0.5", ph:"e.g. 38", hint:"Same on the right. The gap between your two legs is the number that matters.", fmt:fmtFeetIn, trend:"up" },
    { key:"kickFG", label:"Longest Field Goal Made", unit:"yd", step:"1", ph:"e.g. 25", hint:"Made, not attempted. Off a block or a holder.", fmt:fmtYd, trend:"up" },
    { key:"sprint10", label:"10-Yard Sprint", unit:"sec", step:"0.1", ph:"e.g. 2.3", hint:"Have someone time you with a phone — lower is faster.", fmt:fmtSec, trend:"down" }
  ];

  function parseNum(str){
    if(str === undefined || str === null) return null;
    var s = String(str).trim();
    if(s === "") return null;
    var n = parseFloat(s);
    return isNaN(n) ? null : n;
  }

  function currentProgramDay(){
    var next = getNextIncompleteDay();
    return next ? next : TOTAL_DAYS;
  }

  function getMetricSeries(key){
    return state.measurements
      .filter(function(m){ return m[key] !== undefined && m[key] !== null; })
      .map(function(m){ return { date:m.date, day:m.day, value:+m[key] }; });
  }

  function fmtDate(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month:"short", day:"numeric" });
  }

  function sparkline(values){
    if(values.length < 2) return "";
    var w = 280, h = 46, pad = 6;
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var range = (max - min) || 1;
    var stepX = (w - pad*2) / (values.length - 1);
    var pts = values.map(function(v, i){
      var x = pad + i*stepX;
      var y = pad + (h - pad*2) - ((v - min)/range)*(h - pad*2);
      return [x,y];
    });
    var path = pts.map(function(p,i){ return (i===0?"M":"L") + p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
    var dots = pts.map(function(p,i){
      var isLast = i === pts.length - 1;
      return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (isLast?4:2.5) + '" fill="var(--volt)"' + (isLast?' stroke="var(--surface)" stroke-width="2"':'') + '/>';
    }).join("");
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">'
      + '<path d="' + path + '" fill="none" stroke="var(--volt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
      + dots
      + '</svg>';
  }

  function saveMeasurement(){
    var today = todayStr();
    var idx = state.measurements.findIndex(function(m){ return m.date === today; });
    var entry = idx >= 0 ? Object.assign({}, state.measurements[idx]) : { date:today };
    METRICS.forEach(function(m){
      var input = document.getElementById("m_" + m.key);
      var v = parseNum(input ? input.value : null);
      if(v !== null) entry[m.key] = v;
    });
    entry.day = currentProgramDay();
    if(idx >= 0) state.measurements[idx] = entry; else state.measurements.push(entry);
    state.measurements.sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    saveState();
    renderProgressView();
  }

  function deleteMeasurement(date){
    if(!window.confirm("Delete this check-in?")) return;
    state.measurements = state.measurements.filter(function(m){ return m.date !== date; });
    saveState();
    renderProgressView();
  }

  function renderProgressView(){
    var el = document.getElementById("view-progress");
    var html = '';

    html += '<div class="card">'
      + '<div class="phtitle">Log a Check-In</div>'
      + '<div class="phsub">Day ' + currentProgramDay() + ' &middot; ' + fmtDate(todayStr()) + '. Best times: Day 1, Day 22, Day 43, and Day 63 — or anytime. Leave any field blank to skip it.</div>';
    METRICS.forEach(function(m){
      html += '<div class="mrow">'
        + '<label for="m_' + m.key + '">' + m.label + '</label>'
        + '<div class="inputwrap"><input id="m_' + m.key + '" type="number" inputmode="decimal" step="' + m.step + '" placeholder="' + m.ph + '"><span class="unit">' + m.unit + '</span></div>'
        + '<div class="hint">' + m.hint + '</div>'
        + '</div>';
    });
    html += '<button class="complete-btn" id="saveMeasureBtn">Save Check-In</button>'
      + '</div>';

    METRICS.forEach(function(m){
      var series = getMetricSeries(m.key);
      html += '<div class="metric-card"><div class="mlabel">' + m.label + '</div>';
      if(series.length === 0){
        html += '<div class="empty">Not logged yet</div>';
      } else {
        var latest = series[series.length-1].value;
        html += '<div class="mvalue">' + m.fmt(latest) + '</div>';
        if(series.length > 1){
          var first = series[0].value;
          var delta = Math.round((latest-first)*10)/10;
          var deltaClass = "neutral";
          if(m.trend === "up") deltaClass = delta > 0 ? "good" : (delta < 0 ? "bad" : "neutral");
          if(m.trend === "down") deltaClass = delta < 0 ? "good" : (delta > 0 ? "bad" : "neutral");
          var sign = delta >= 0 ? "+" : "";
          html += '<div class="mdelta ' + deltaClass + '">' + sign + delta + ' ' + m.unit + ' since Day ' + series[0].day + '</div>';
          html += sparkline(series.map(function(s){ return s.value; }));
        } else {
          html += '<div class="empty">Log another check-in to see your trend</div>';
        }
      }
      html += '</div>';
    });

    // left vs right: a kicker lives on one plant leg, so the two sides drift apart
    (function(){
      var L = getMetricSeries("sgBroadL"), R = getMetricSeries("sgBroadR");
      if(!L.length || !R.length) return;
      var l = L[L.length-1].value, r = R[R.length-1].value;
      var big = Math.max(l, r); if(!big) return;
      var gap = Math.round(Math.abs(l - r) / big * 100);
      var strong = l > r ? "left" : "right";
      var weak = l > r ? "right" : "left";
      html += '<div class="card asym' + (gap > 15 ? ' warn' : '') + '">'
        + '<div class="phtitle">Left vs Right</div>'
        + '<div class="asymnum">' + gap + '%<span> gap &middot; ' + strong + ' leg is stronger</span></div>'
        + '<div class="phsub">' + (gap > 15
            ? 'Over 15% is worth closing. Add a set on the ' + weak + ' leg in the single-leg work, and test again next check-in.'
            : 'Under 10% is normal. You plant on one leg every kick, so the two sides always drift a little.')
        + '</div></div>';
    })();

    if(state.measurements.length > 0){
      html += '<details class="history"><summary>All Check-Ins (' + state.measurements.length + ')</summary>';
      state.measurements.slice().reverse().forEach(function(m){
        var vals = METRICS.map(function(mt){
          return (m[mt.key] !== undefined && m[mt.key] !== null) ? (mt.label + " " + mt.fmt(m[mt.key])) : null;
        }).filter(Boolean).join(" &middot; ");
        html += '<div class="hrow"><span class="hdate">' + fmtDate(m.date) + '</span><span class="hvals">' + (vals || "—") + '</span><button class="hdel" data-del="' + m.date + '" aria-label="Delete check-in">&times;</button></div>';
      });
      html += '</details>';
    }

    el.innerHTML = html;

    var saveBtn = document.getElementById("saveMeasureBtn");
    if(saveBtn) saveBtn.addEventListener("click", saveMeasurement);
    el.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){ deleteMeasurement(btn.getAttribute("data-del")); });
    });
  }

  };
  var PUMP_MILESTONE = {
    1:"Day one. Nine weeks from now you'll be a different athlete. Let's go.",
    22:"Week 4. The Build block starts now and nobody has quit. Check in your numbers.",
    43:"Week 7. Power block. Everything gets faster from here.",
    63:"Last day. Nine weeks, nobody watching, and you did every one. Go measure it."
  };
  // Start Mondays he can pick from, each with a matching file in reminders/.
  // Football runs into the playoffs, so the start date is his call, not a fixed one.
  var START_MONDAYS = ["2026-11-02","2026-11-09","2026-11-16","2026-11-23","2026-11-30","2026-12-07"];
  var DEFAULT_MONDAY = "2026-11-02";   // the Monday he actually started
  function mondayLabel(iso){
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  }
  // Set once so the picker and its change handler can't say different things.
  function remindNoteHtml(iso){
    var note = 'Day ' + TOTAL_DAYS + ' lands <b>' + lastDayLabel(iso) + '</b>.';
    if(iso === DEFAULT_MONDAY) note += ' That\'s the Monday you started.';
    return note + ' Already added an older set? Adding these replaces the 7am ones '
      + 'and adds the afternoon and evening ones &mdash; you won\'t get doubles.';
  }
  function lastDayLabel(iso){
    var d = new Date(iso + "T00:00:00");
    d.setDate(d.getDate() + TOTAL_DAYS - 1);
    return d.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
  }

  function pumpFor(day, type){
    if(PUMP_MILESTONE[day]) return PUMP_MILESTONE[day];
    var pool = PUMP[type] || PUMP.B;
    return pool[(day * 7 + day) % pool.length];
  }

  // ---------- State ----------

  var STORE_KEY = "desmondPower_v1";
  function loadState(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { completed:{}, completionDates:[], selectedDay:1, checks:{}, measurements:[] };
  }
  function saveState(event, meta){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    syncPush(event, meta);
  }

  // ---------- Progress sync ----------
  // Mirrors progress to a Google Sheet through an Apps Script web app
  // (apps-script.gs in this repo), so a parent can see sessions as they
  // happen instead of asking, and so an installed iOS app that drops its
  // localStorage can heal itself. Inert until a parent pastes the sync link
  // (the /exec URL + "#" + token that apps-script.gs's showSyncLink() logs)
  // into Progress Sync. It is kept in state.sync, so it lives on this phone
  // and inside the backup code, and never in this public file.
  // Everything below is local-first, so the app works the same offline.
  var syncTimer = null, syncStatus = "idle", syncAt = null, syncRestored = 0;

  function syncCfg(){ return (state && state.sync) || {}; }
  function syncOn(){ var c = syncCfg(); return !!(c.url && c.token); }
  // "https://script.google.com/macros/s/.../exec#token" -> {url, token}
  function parseSyncLink(text){
    var t = String(text || "").trim();
    var i = t.indexOf("#");
    if(i < 0) return null;
    var url = t.slice(0, i).trim(), token = t.slice(i + 1).trim();
    if(!/^https:\/\/\S+$/.test(url) || !token) return null;
    return { url: url, token: token };
  }
  // The link is the key to the Sheet, so it never travels up with the progress.
  function stateForCloud(){
    var copy = {};
    Object.keys(state).forEach(function(k){ if(k !== "sync") copy[k] = state[k]; });
    return copy;
  }

  // Derived facts travel with the state so the backend never has to carry a
  // second copy of the program and drift from this file.
  function syncSummary(meta){
    var next = getNextIncompleteDay();
    var day = next || TOTAL_DAYS;
    var row = SCHEDULE[day - 1] || {};
    var count = Object.keys(state.completed).length;
    return {
      day: day, total: TOTAL_DAYS,
      type: TYPE_LABEL[row.type] || "",
      week: row.week || null, weeks: 9,
      phase: (PHASES[row.phase] || {}).name || "",
      pct: Math.round(count / TOTAL_DAYS * 100),
      streak: computeStreak(),
      completedCount: count,
      todayDone: state.completionDates.indexOf(todayStr()) !== -1,
      // The day just finished, which is NOT the same as the day now up next.
      doneDay: (meta && meta.doneDay) || null,
      doneType: (meta && meta.doneDay && TYPE_LABEL[(SCHEDULE[meta.doneDay - 1] || {}).type]) || ""
    };
  }

  function syncPush(event, meta){
    if(!syncOn()) return;
    if(syncTimer) clearTimeout(syncTimer);
    var ev = event || "save";
    syncTimer = setTimeout(function(){ syncSend(ev, meta); }, 1200);
  }

  function syncSend(event, meta){
    if(!syncOn()) return;
    var body = JSON.stringify({
      token: syncCfg().token, event: event, state: stateForCloud(), summary: syncSummary(meta)
    });
    var opts = {
      method: "POST",
      cache: "no-store",
      // text/plain keeps this a simple request, so the browser skips the
      // preflight Apps Script will not answer. The script reads the raw body.
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: body
    };
    // keepalive lets a last push survive the app being closed, but it caps the
    // body at 64KB, so only use it while the payload is comfortably small.
    if(body.length < 50000) opts.keepalive = true;
    fetch(syncCfg().url, opts).then(function(r){
      return r.json().catch(function(){ return { ok:true }; });
    }).then(function(res){
      syncMark(res && res.ok === false ? "fail" : "ok");
    }).catch(function(){ syncMark("fail"); });
  }

  // Heal a wiped phone: only take the cloud copy when it is strictly ahead,
  // so a deliberate un-tick here is never undone by a stale copy there.
  function syncMerge(cloud){
    if(!cloud || typeof cloud !== "object") return 0;
    var cloudDone = Object.keys(cloud.completed || {}).filter(function(k){
      return !!cloud.completed[k];
    });
    var localCount = Object.keys(state.completed).length;
    if(cloudDone.length <= localCount) return 0;

    var gained = 0;
    cloudDone.forEach(function(k){
      if(!state.completed[k]){ state.completed[k] = true; gained++; }
    });
    (cloud.completionDates || []).forEach(function(ds){
      if(state.completionDates.indexOf(ds) === -1) state.completionDates.push(ds);
    });
    Object.keys(cloud.checks || {}).forEach(function(k){
      if(cloud.checks[k]) state.checks[k] = true;
    });
    var byDate = {};
    state.measurements.forEach(function(m){ if(m && m.date) byDate[m.date] = m; });
    (cloud.measurements || []).forEach(function(m){
      if(m && m.date && !byDate[m.date]) byDate[m.date] = m;
    });
    state.measurements = Object.keys(byDate).sort().map(function(d){ return byDate[d]; });
    state.selectedDay = getNextIncompleteDay() || TOTAL_DAYS;
    return gained;
  }

  function syncPull(){
    if(!syncOn()) return Promise.resolve(0);
    return fetch(syncCfg().url + "?token=" + encodeURIComponent(syncCfg().token), { cache: "no-store" })
      .then(function(r){ return r.json(); })
      .then(function(res){
        if(!res || !res.ok) throw new Error("not ok");
        var gained = syncMerge(res.state);
        if(gained > 0){
          syncRestored = gained;
          try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
          renderAll();
        }
        syncMark("ok");
        return gained;
      })
      .catch(function(){ syncMark("fail"); return 0; });
  }

  function syncMark(status){
    syncStatus = status;
    if(status === "ok") syncAt = new Date();
    syncRefreshLine();
  }

  function syncNote(){
    if(!syncOn()) return "Not set up yet, so progress is saved on this phone only. A parent can paste the sync link below to turn it on.";
    if(syncStatus === "fail") return "Could not reach the sync server just now. Progress is still safe on this phone and will go up on the next change.";
    var line = "On. Finishing a day sends it up, and a parent gets an email.";
    if(syncRestored > 0) line = "Restored " + syncRestored + (syncRestored === 1 ? " day" : " days") + " from the cloud copy. " + line;
    if(syncAt) line += " Last sent " + syncAt.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" }) + ".";
    return line;
  }

  function syncRefreshLine(){
    var el = document.getElementById("syncSub");
    if(el) el.textContent = syncNote();
  }

  function syncBoot(){
    if(!syncOn()) return;
    syncPull().then(function(){ syncSend("open"); });
  }

  document.addEventListener("click", function(e){
    var t = e.target && e.target.closest ? e.target : null;
    if(!t) return;
    if(t.closest("#syncSaveBtn")){
      var cfg = parseSyncLink(document.getElementById("syncLinkBox").value);
      if(!cfg){
        document.getElementById("syncLinkNote").textContent = "That doesn't look like a sync link. It should start with https:// and have a # followed by the token.";
        return;
      }
      state.sync = cfg;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(err){}
      renderProgram();
      syncBoot();
      return;
    }
    if(t.closest("#syncForgetBtn")){
      if(!window.confirm("Remove the sync link from this phone? Progress stays here; it just stops going to the Sheet.")) return;
      delete state.sync;
      syncStatus = "idle"; syncAt = null; syncRestored = 0;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(err){}
      renderProgram();
      return;
    }
  });

  document.addEventListener("click", function(e){
    var btn = e.target && e.target.closest ? e.target.closest("#syncNowBtn") : null;
    if(!btn) return;
    btn.disabled = true;
    btn.textContent = "Checking\u2026";
    syncPull().then(function(){
      btn.disabled = false;
      btn.textContent = "Check for updates";
    });
  });
  var state = loadState();
  if(!state.completed) state.completed = {};
  if(!state.completionDates) state.completionDates = [];
  if(!state.checks) state.checks = {};
  if(!state.measurements) state.measurements = [];
  if(!state.selectedDay) state.selectedDay = getNextIncompleteDay() || 1;

  function getNextIncompleteDay(){
    for(var i=1;i<=TOTAL_DAYS;i++){
      if(!state.completed[i]) return i;
    }
    return null;
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function computeStreak(){
    var set = {};
    state.completionDates.forEach(function(ds){ set[ds] = true; });
    var cursor = new Date();
    if(!set[todayStrFrom(cursor)]) cursor.setDate(cursor.getDate()-1);
    var streak = 0;
    while(set[todayStrFrom(cursor)]){
      streak++;
      cursor.setDate(cursor.getDate()-1);
    }
    return streak;
  }
  function todayStrFrom(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function completedCount(){
    return Object.keys(state.completed).length;
  }

  // ---------- Rendering ----------

  var currentTab = "today";

  function renderStats(){
    var done = completedCount();
    document.getElementById("progFill").style.width = Math.round(done/TOTAL_DAYS*100) + "%";
    var streak = computeStreak();
    var sel = SCHEDULE[state.selectedDay-1];
    var line = "Day " + state.selectedDay + " of " + TOTAL_DAYS + " &middot; Week " + sel.week + " &middot; <b>" + done + "/" + TOTAL_DAYS + "</b> done";
    if(streak > 0) line += " &middot; 🔥 " + streak + "-day streak";
    document.getElementById("statLine").innerHTML = line;
  }

  function exKey(day, section, idx){ return day+"_"+section+"_"+idx; }

  function exerciseList(day, section, list){
    var html = '<ul class="exlist">';
    list.forEach(function(ex, idx){
      var key = exKey(day, section, idx);
      var checked = !!state.checks[key];
      var tag = ex.eq === "db" ? '<span class="tag">DB</span>' : "";
      var info = exInfoFor(ex.name);
      var infoBtn = info ? ' <button class="ex-info" data-exname="' + ex.name + '" aria-label="Learn about ' + ex.name + '">i</button>' : "";
      html += '<li>'
        + '<div class="exbox' + (checked?' checked':'') + '" data-exkey="' + key + '" role="checkbox" aria-checked="' + checked + '"></div>'
        + '<div class="exmeta">'
        + '<div class="exname">' + ex.name + infoBtn + tag + '<span class="exreps">' + (ex.reps||"") + '</span></div>'
        + (ex.cue ? '<div class="excue">' + ex.cue + '</div>' : '')
        + '</div></li>';
    });
    html += '</ul>';
    return html;
  }

  function renderToday(){
    var el = document.getElementById("view-today");
    var day = state.selectedDay;
    var entry = SCHEDULE[day-1];
    var isDone = !!state.completed[day];

    if(!entry){
      el.innerHTML = '<div class="card celebrate"><div class="big">🏆</div><h2>Program complete!</h2><p>All 9 weeks done. That\'s a real offseason of work — baseball and next football season both get to feel it.</p></div>';

    }

    var phase = PHASES[entry.phase];
    var html = '';

    if(completedCount() === TOTAL_DAYS){
      html += '<div class="card celebrate" style="padding:18px;margin-bottom:14px">'

        + '<h2 style="font-size:21px;margin-bottom:6px">All 9 weeks complete!</h2>'
        + '<p style="font-size:14px">That\'s a full offseason of work in the books — baseball and next football season both get to feel it. Browse any day below to look back or redo one.</p>'
        + '</div>';

    if(entry.type === "REST"){
      var tip = RECOVERY_TIPS[(entry.week-1) % RECOVERY_TIPS.length];

      html += '<div class="card rest-card">'
        + '<div class="daynav"><button data-nav="-1" ' + (day<=1?'disabled':'') + '>&larr; Prev</button><span class="phase-pill">' + phase.name + '</span><button data-nav="1" ' + (day>=TOTAL_DAYS?'disabled':'') + '>Next &rarr;</button></div>'
        + '<div class="daynum">Day ' + day + ' of ' + TOTAL_DAYS + ' &middot; Week ' + entry.week + '</div>'

        + '</div>';
    } else {
      var wk = entry.workout;
      var rounds = wk.roundsByWeek[entry.weekInPhase];
      html += '<div class="pump">' + pumpFor(day, entry.type) + '</div>';
      html += '<div class="card">'
        + '<div class="daynav"><button data-nav="-1" ' + (day<=1?'disabled':'') + '>&larr; Prev</button><span class="phase-pill">' + phase.name + '</span><button data-nav="1" ' + (day>=TOTAL_DAYS?'disabled':'') + '>Next &rarr;</button></div>'
        + '<div class="daynum">Day ' + day + ' of ' + TOTAL_DAYS + ' &middot; Week ' + entry.week + '</div>'
        + '<div class="daytitle">' + wk.title + '</div>'
        + '<div class="daytime">' + wk.time + ' &middot; great right after you wake up</div>'
        + '<div class="section-head">Warm-Up</div>'
        + exerciseList(day, "warmup", wk.warmup)
        + '<div class="section-head">Main Set <span class="chip">' + rounds + ' rounds</span></div>'
        + exerciseList(day, "main", wk.main)
        + '<div class="section-head">Cooldown</div>'
        + exerciseList(day, "cooldown", wk.cooldown)
        + (wk.note ? '<div class="note"><b>Why it matters</b>' + wk.note + '</div>' : '')
        + '<button class="complete-btn' + (isDone?' done':'') + '" id="completeBtn">' + (isDone ? "✅ Marked complete — tap to undo" : "Mark day complete") + '</button>'
        + '</div>';
    }

    el.innerHTML = html;

    el.querySelectorAll("[data-exkey]").forEach(function(box){
      box.addEventListener("click", function(){
        var key = box.getAttribute("data-exkey");
        state.checks[key] = !state.checks[key];
        saveState();
        box.classList.toggle("checked", !!state.checks[key]);
        box.setAttribute("aria-checked", !!state.checks[key]);
      });
    });
    el.querySelectorAll("[data-exname]").forEach(function(btn){
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        openExerciseModal(btn.getAttribute("data-exname"));
      });
    });
    el.querySelectorAll("[data-nav]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var delta = parseInt(btn.getAttribute("data-nav"), 10);
        state.selectedDay = Math.min(TOTAL_DAYS, Math.max(1, state.selectedDay + delta));
        saveState();
        renderAll();
      });
    });
    var cb = document.getElementById("completeBtn");
    if(cb){
      cb.addEventListener("click", function(){
        var nowDone = !state.completed[day];
        if(nowDone){
          state.completed[day] = true;

          var next = getNextIncompleteDay();
          if(next) state.selectedDay = next;
        } else {
          delete state.completed[day];
        }

  }

        var entry = SCHEDULE[dayNum-1];

      + '<div class="phtitle">Progress Sync</div>'

      + (syncOn()

          + '<button class="modal-video-btn" id="syncSaveBtn" type="button" style="margin-top:10px">Save sync link</button>'

      + '</div>';
    html += '<div class="card">'
      + '<div class="phtitle">Backup Progress</div>'
      + '<div class="phsub">An installed phone app can sometimes lose its saved data on its own. After a workout or check-in, tap Show Backup Code, copy the text, and save it somewhere (Notes, a message to yourself) so progress can be restored if that happens.' + (syncOn() ? ' It includes the sync link, so keep it private.' : '') + '</div>'
      + '<button class="modal-video-btn" id="showBackupBtn" type="button" style="margin-bottom:10px">Show Backup Code</button>'

        + '<div id="restoreNote" class="backup-note"></div>'

    html += '<div class="resetwrap"><button id="resetBtn">Reset all progress</button></div>';
    var startPick = state.startMonday || DEFAULT_MONDAY;

      + '<div class="remindnote" id="remindNote">' + remindNoteHtml(startPick) + '</div>'

    el.innerHTML = html;

    el.querySelectorAll("[data-day]").forEach(function(chip){

          state = { completed:{}, completionDates:[], selectedDay:1, checks:{}, measurements:[] };
          if(keepSync) state.sync = keepSync;

      });
    }
    var showBackupBtn = document.getElementById("showBackupBtn");
    var backupCodeBox = document.getElementById("backupCodeBox");
    var backupCopyNote = document.getElementById("backupCopyNote");
    if(showBackupBtn){
      showBackupBtn.addEventListener("click", function(){
        var alreadyShown = !backupCodeBox.hidden;
        if(alreadyShown){
          backupCodeBox.hidden = true;
          backupCopyNote.hidden = true;
          showBackupBtn.textContent = "Show Backup Code";
          return;
        }
        backupCodeBox.value = backupCode();
        backupCodeBox.hidden = false;
        backupCopyNote.hidden = false;
        backupCopyNote.textContent = "Tap the text above, select all, and copy it.";
        showBackupBtn.textContent = "Hide Backup Code";
        backupCodeBox.focus();
        backupCodeBox.select();
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(backupCodeBox.value).then(function(){
            backupCopyNote.textContent = "Copied to your clipboard — paste it somewhere safe. (Or select the text above yourself.)";
          }).catch(function(){});
        }
      });
    }
    var showRestoreBtn = document.getElementById("showRestoreBtn");
    var restoreWrap = document.getElementById("restoreWrap");
    if(showRestoreBtn){
      showRestoreBtn.addEventListener("click", function(){
        var alreadyShown = !restoreWrap.hidden;
        restoreWrap.hidden = alreadyShown;
        showRestoreBtn.textContent = alreadyShown ? "Restore From Backup Code" : "Hide Restore";
      });
    }
    var restoreNowBtn = document.getElementById("restoreNowBtn");
    if(restoreNowBtn){
      restoreNowBtn.addEventListener("click", function(){
        var code = document.getElementById("restoreCodeBox").value;
        var note = document.getElementById("restoreNote");
        if(!code.trim()){ note.textContent = "Paste a backup code first."; return; }
        if(restoreFromCode(code)){
          note.textContent = "Progress restored.";
          renderAll();
        } else {
          note.textContent = "That doesn't look like a valid backup code.";
        }
      });
    }
  }

  function backupCode(){
    return btoa(encodeURIComponent(JSON.stringify(state)));
  }
  function restoreFromCode(code){
    try{
      var parsed = JSON.parse(decodeURIComponent(atob(code.trim())));
      if(!parsed || typeof parsed !== "object") return false;
      if(!parsed.sync && state.sync) parsed.sync = state.sync; // an older code has no link; keep this phone's
      state = parsed;
      if(!state.completed) state.completed = {};
      if(!state.completionDates) state.completionDates = [];
      if(!state.checks) state.checks = {};
      if(!state.measurements) state.measurements = [];
      if(!state.selectedDay) state.selectedDay = getNextIncompleteDay() || 1;
      saveState();
      return true;
    }catch(e){
      return false;
    }
  }

  function renderAll(){
    renderStats();
    renderToday();
    renderProgram();
    renderProgressView();
  }

  function setTab(tab){
    currentTab = tab;
    document.querySelectorAll(".tab").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-tab") === tab ? "true" : "false");
    });
    document.getElementById("view-today").hidden = tab !== "today";
    document.getElementById("view-program").hidden = tab !== "program";
    document.getElementById("view-progress").hidden = tab !== "progress";
    window.scrollTo(0,0);
  }

  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){ setTab(btn.getAttribute("data-tab")); });
  });

  document.getElementById("exClose").addEventListener("click", closeExerciseModal);
  document.getElementById("exOverlay").addEventListener("click", function(e){
    if(e.target.id === "exOverlay") closeExerciseModal();
  });
  document.getElementById("videoClose").addEventListener("click", closeVideoLightbox);
  document.getElementById("videoOverlay").addEventListener("click", function(e){
    if(e.target.id === "videoOverlay") closeVideoLightbox();
  });
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(!document.getElementById("videoOverlay").hidden) closeVideoLightbox();
    else closeExerciseModal();
  });

  // Insert the info strip once, above the tabs
  var infoStrip = document.createElement("div");
  infoStrip.className = "info-strip";
  infoStrip.innerHTML = "<b>Gear:</b> just your body + 5 / 8 / 10 lb dumbbells a few days a week, sneakers, a little open floor.<br><b>Safety:</b> always warm up first, land soft and controlled, and stop if anything hurts.";
  document.querySelector("nav.tabs").parentNode.insertBefore(infoStrip, document.querySelector("nav.tabs"));

  // Ask the browser not to evict this app's saved progress under storage
  // pressure. Best-effort only -- iOS in particular doesn't always honor it,
  // which is also why the Backup Progress button exists (Progress tab).
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persist().catch(function(){});
  }

  renderAll();
  syncBoot();
})();
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
<script src="install.js"></script>
</body>
</html>
